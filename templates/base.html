<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>E2E Project Management</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
body{background:#f5f7fa}.navbar{background:#1f2937}.brand{font-weight:700}
.card{border:0;box-shadow:0 2px 12px rgba(0,0,0,.06)}.kpi{font-size:1.65rem;font-weight:700}
.sidebar{min-height:calc(100vh - 56px);background:#111827}.sidebar a{color:#d1d5db;text-decoration:none;display:block;padding:12px 16px}
.sidebar a:hover{background:#374151;color:white}.status{font-size:.8rem}
</style>
</head>
<body>
<nav class="navbar navbar-dark">
<div class="container-fluid"><a class="navbar-brand brand" href="/">E2E Project Creation</a><span class="text-light">Project Management Demo</span></div>
</nav>
<div class="container-fluid">
<div class="row">

<main class="col-md-10 p-4">
{% with messages = get_flashed_messages(with_categories=true) %}
{% for category,msg in messages %}<div class="alert alert-{{category}}">{{msg}}</div>{% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</main>
</div></div>
</body></html>
